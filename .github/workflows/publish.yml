name: Build and publish container image

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  # Never interrupt an in-flight release. A cancelled push could leave the
  # registries and the GitHub release with different artifacts.
  cancel-in-progress: false

env:
  IMAGE_NAME: remote-dev-toolbox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME || 'dockerhub' }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=remote-dev-toolbox
          cache-to: type=gha,mode=max,scope=remote-dev-toolbox
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar

      - name: Generate image checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar
        run: |
          cd "${RUNNER_TEMP}"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload image tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64
          path: |
            ${{ runner.temp }}/${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar
            ${{ runner.temp }}/${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar
            dist/${{ env.IMAGE_NAME }}-${{ github.ref_name }}-linux-amd64.tar.sha256
